<!doctype html>
<html lang="so"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5C4A"><title>Shaqo — East Africa</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shaqo"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#F7F8F5;--card:#fff;--card2:#FAFBF8;--ink:#0F1A17;--mut:#5A6862;--line:#E5E9E2;--line2:#D4DAD0;--ac:#0E5C4A;--ac2:#157A62;--ac3:#1FA88B;--acink:#fff;--gold:#B8860B;--red:#C62828;--redbg:#FEECEC;--amber:#B85C00;--amberbg:#FFF7EC;--blue:#1E5FA8;--bluebg:#EAF1FA;--green:#1F7A3B;--greenbg:#E8F5EC;--purple:#6B3FA0;--purplebg:#F2EAFA;--shadow-sm:0 1px 2px rgba(15,26,23,.04);--shadow:0 1px 3px rgba(15,26,23,.06),0 4px 16px rgba(15,26,23,.04);--shadow-lg:0 8px 32px rgba(15,26,23,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1210;--card:#1A211D;--card2:#1F2723;--ink:#EAF2EE;--mut:#9AACA3;--line:#2A332E;--line2:#3A4540;--ac:#4FB89D;--ac2:#5FC9AE;--ac3:#7DDCB8;--acink:#08130F;--gold:#E5B84B;--red:#FF8A80;--redbg:#2A1414;--amber:#FFB74D;--amberbg:#2A1F10;--blue:#6BA3E8;--bluebg:#0F1F33;--green:#6FCF97;--greenbg:#0F2618;--purple:#B794E0;--purplebg:#231830;--shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);--shadow-lg:0 8px 32px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1210;--card:#1A211D;--card2:#1F2723;--ink:#EAF2EE;--mut:#9AACA3;--line:#2A332E;--line2:#3A4540;--ac:#4FB89D;--ac2:#5FC9AE;--ac3:#7DDCB8;--acink:#08130F;--gold:#E5B84B;--red:#FF8A80;--redbg:#2A1414;--amber:#FFB74D;--amberbg:#2A1F10;--blue:#6BA3E8;--bluebg:#0F1F33;--green:#6FCF97;--greenbg:#0F2618;--purple:#B794E0;--purplebg:#231830;--shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);--shadow-lg:0 8px 32px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(140px + env(safe-area-inset-bottom,0px));overflow-x:hidden;-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:1140px;margin:0 auto}
.brand{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--ac),var(--ac2),var(--ac3));background-size:200% 200%;animation:gradientMove 5s ease infinite;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.7px}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#lg{width:auto;min-height:40px;padding:8px 14px;border-radius:11px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;overflow-x:auto;background:var(--card);border:1px solid var(--line);padding:8px;z-index:50;box-shadow:var(--shadow-lg);border-radius:22px;backdrop-filter:blur(20px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;color:var(--mut);font:inherit;font-size:13px;font-weight:600;padding:10px 14px;min-height:44px;border-radius:14px;cursor:pointer;white-space:nowrap;transition:all .2s ease}
nav button.on{color:var(--acink);background:linear-gradient(135deg,var(--ac),var(--ac2));font-weight:700;box-shadow:0 4px 12px rgba(14,92,74,.35)}
main{max-width:1140px;margin:0 auto;padding:0 20px 24px}
h2{margin:16px 0 14px;font-size:20px;font-weight:800;letter-spacing:-.2px}h3{font-size:15px;margin:20px 0 10px;font-weight:700}
.page-header{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.page-title{font-size:26px;font-weight:900;margin:0;letter-spacing:-.6px;line-height:1.2}
.page-sub{font-size:13px;color:var(--mut);margin:6px 0 0;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.warn{background:var(--amberbg);border:1px solid rgba(184,92,0,.3);border-radius:14px;padding:14px 16px;margin-bottom:12px;position:relative}
.warn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);border-radius:14px 0 0 14px}
.warn.danger{background:var(--redbg);border-color:rgba(198,40,40,.3)}.warn.danger::before{background:var(--red)}
.warn.success{background:var(--greenbg);border-color:rgba(31,122,59,.3)}.warn.success::before{background:var(--green)}
.warn b{color:var(--amber);font-weight:700}.warn.danger b{color:var(--red)}.warn.success b{color:var(--green)}
.warn ul{margin:8px 0 0;padding-left:20px}.warn li{margin:6px 0;font-size:13px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.av{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);border:2px solid var(--card)}
.pv{width:76px;height:76px;object-fit:cover;border-radius:12px;margin:8px 4px 0 0;border:1px solid var(--line)}
.s{font-size:12px;color:var(--mut);line-height:1.5}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:16px;padding:3px 9px;margin:4px 4px 0 0;color:var(--mut);background:var(--card2);line-height:1.4}
.tag.g{border-color:var(--ac);color:var(--ac);background:rgba(14,92,74,.06)}
.tag.r{border-color:var(--red);color:var(--red);background:rgba(198,40,40,.06)}
.tag.b{border-color:var(--blue);color:var(--blue);background:rgba(30,95,168,.06)}
button.p,button.d{border:0;border-radius:12px;padding:12px 18px;min-height:48px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acink);box-shadow:0 4px 12px rgba(14,92,74,.22);transition:transform .15s}
button.p:active,button.d:active{transform:scale(.97)}
button.d{background:linear-gradient(135deg,var(--red),#A01E1E)}
button.o{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;min-height:44px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:all .15s}
button.o:hover{border-color:var(--ac);color:var(--ac);background:var(--card2)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:9px 15px;min-height:40px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--ac)}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acink);border-color:transparent;box-shadow:0 2px 8px rgba(14,92,74,.25)}
.fv{background:none;border:0;font-size:24px;min-width:44px;min-height:44px;cursor:pointer;color:var(--red);transition:transform .15s}
.fv:hover{transform:scale(1.15)}
input,select,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);min-height:48px;transition:border-color .15s,box-shadow .15s;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(14,92,74,.1)}
input[style*="display:none"]{display:none!important}
.fl select,.fl input{width:auto}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px}
label.ck{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px;margin:10px 0;cursor:pointer;line-height:1.4;text-transform:none;letter-spacing:0}
label.ck input{width:20px;height:20px;min-height:20px;flex:none;margin-top:1px;accent-color:var(--ac);border-radius:6px}
.form-section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.form-section:first-child{border-top:0;padding-top:0;margin-top:0}
.form-section h4{font-size:11px;font-weight:800;color:var(--ac);margin:0 0 14px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
.filter-bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow-sm)}
@media(max-width:520px){.filter-bar{grid-template-columns:1fr}}
.filter-bar select{width:100%;min-height:44px;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.filter-bar select:disabled{opacity:.5;cursor:not-allowed}
.filter-bar .other-input{margin-top:8px;grid-column:1/-1}
#sos{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:26px;padding:14px 22px;font-weight:800;font-size:14px;background:linear-gradient(135deg,#C62828,#8E1B1B);color:#fff;border:0;cursor:pointer;min-height:48px;box-shadow:0 6px 20px rgba(198,40,40,.4);animation:sosPulse 2s infinite;letter-spacing:.5px}
@keyframes sosPulse{0%,100%{box-shadow:0 6px 20px rgba(198,40,40,.4)}50%{box-shadow:0 6px 28px rgba(198,40,40,.65)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#modal[hidden]{display:none}
#mb{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:slideUp .3s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:760px){#modal{align-items:center}#mb{border-radius:22px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:12px;z-index:80;font-size:14px;font-weight:600;max-width:90%;box-shadow:var(--shadow-lg)}
#toast[hidden]{display:none}
footer{text-align:center;margin:36px 0 20px;font-size:12px;color:var(--mut);line-height:1.8}
footer a{color:var(--ac);text-decoration:none;font-weight:600}
footer button{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:12px;margin:0 2px}
footer button:hover{background:var(--card2)}
.warn-banner{background:linear-gradient(135deg,var(--redbg),rgba(198,40,40,.04));border:1px solid rgba(198,40,40,.35);border-radius:14px;padding:13px 16px;margin-bottom:14px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center}
.warn-banner b{color:var(--red);font-weight:700}
.time-picker{display:inline-flex;align-items:center;gap:6px;width:100%}
.time-picker select{width:auto;flex:1;min-height:48px;padding:10px 8px;font-size:14px;font-weight:700;text-align:center;cursor:pointer;border-radius:10px}
.tp-sep{font-weight:900;color:var(--mut);padding:0 2px;font-size:16px}
.welcome-hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:22px;height:220px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--shadow-lg)}
.welcome-hero img{width:100%;height:100%;object-fit:cover;opacity:.45}
.welcome-hero .wh-text{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center;padding:24px;background:linear-gradient(to top,rgba(0,0,0,.4),transparent 55%);z-index:1}
.welcome-hero h1{font-size:42px;margin:0;font-weight:900;letter-spacing:-1.5px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.welcome-hero p{margin:10px 0 0;opacity:.98;font-size:14px;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.role-cards{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:24px}
@media(max-width:420px){.role-cards{grid-template-columns:1fr}}
.role-card{border:0;border-radius:20px;padding:28px 16px;cursor:pointer;text-align:center;color:#fff;position:relative;overflow:hidden;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:var(--shadow-lg);transition:transform .2s ease}
.role-card:active{transform:scale(.98)}
.role-card.employer{background:linear-gradient(135deg,var(--blue),#0F3D73)}
.role-card.worker{background:linear-gradient(135deg,#C2610D,#8A3F08)}
.role-card .role-icon{font-size:54px;margin-bottom:10px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.role-card h2{margin:0;font-size:20px;font-weight:900;color:#fff}
.role-card p{margin:8px 0 0;font-size:12px;opacity:.95;line-height:1.4;font-weight:500}
.role-card .arrow{margin-top:14px;font-size:20px;font-weight:700}
.cat-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.cat-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card);text-align:left;padding:0;font:inherit;color:var(--ink);box-shadow:var(--shadow-sm);transition:all .2s ease}
.cat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--ac)}
.cat-card img{width:100%;height:82px;object-fit:cover;display:block}
.cat-card .cc-body{padding:10px 12px}
.cat-card b{font-size:13px;display:block;font-weight:700;line-height:1.3}
.cat-card .s{font-size:10px;margin-top:3px;color:var(--mut)}
.role-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:18px;font-weight:700}
.role-pill.employer{background:var(--bluebg);color:var(--blue)}
.role-pill.worker{background:#FBF0E4;color:#8A3F08}
.role-pill.guest{background:var(--greenbg);color:var(--green)}
.promo-banner{background:linear-gradient(135deg,#B8860B 0%,#D4A017 25%,#FFD700 50%,#D4A017 75%,#B8860B 100%);background-size:200% 200%;animation:shimmerBg 4s linear infinite;border-radius:16px;padding:18px 20px;margin-bottom:22px;cursor:pointer;color:#1a1a1a;text-align:center;box-shadow:0 6px 20px rgba(184,134,11,.3);position:relative;overflow:hidden;border:0;width:100%;font:inherit}
@keyframes shimmerBg{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.promo-banner b{font-size:15px;font-weight:900;display:block;color:#0a1a10}
.promo-banner span{font-size:12px;font-weight:700;display:block;margin-top:4px;color:#2a2a2a}
.stars{display:inline-flex;gap:1px;color:var(--gold);font-size:13px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-card .n{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.stat-card .l{font-size:11px;color:var(--mut);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.country-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
.country-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.country-card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--shadow)}
.country-card .flag{font-size:32px;line-height:1;display:block;margin-bottom:8px}
.country-card b{display:block;font-size:13px;font-weight:700}
.country-card .s{font-size:11px;margin-top:4px}
.explanation-row{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:12px;color:var(--mut);line-height:1.6}
.explanation-row b{color:var(--ink);font-weight:700}
#promoPopup{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .35s ease}
#promoPopup[hidden]{display:none}
.promo-card{background:linear-gradient(135deg,#B8860B 0%,#D4A017 20%,#FFD700 40%,#FFED4E 50%,#FFD700 60%,#D4A017 80%,#B8860B 100%);background-size:300% 300%;animation:shimmerBg 3s linear infinite,promoPop .6s cubic-bezier(.34,1.56,.64,1);border-radius:24px;padding:36px 22px 26px;max-width:440px;width:100%;text-align:center;color:#1a1a1a;box-shadow:0 24px 80px rgba(184,134,11,.6);position:relative;overflow:hidden}
@keyframes promoPop{0%{transform:scale(.4) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.promo-close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.25);color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:22px;font-weight:700;cursor:pointer;z-index:10;line-height:1}
.promo-emoji{font-size:68px;animation:promoBounce 1.2s ease-in-out infinite;display:inline-block;position:relative;z-index:2;line-height:1}
@keyframes promoBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.1)}}
.promo-card h2{font-size:24px;font-weight:900;margin:12px 0 8px;color:#0a1a10;position:relative;z-index:2;line-height:1.2}
.promo-tagline{font-size:14px;font-weight:800;color:#1a1a1a;margin:10px 0;position:relative;z-index:2}
.promo-card p{font-size:13px;line-height:1.6;margin:12px 0;color:#1a1a1a;position:relative;z-index:2;font-weight:500}
.promo-cta-text{font-size:16px;font-weight:900;color:#0a1a10;margin:14px 0!important;position:relative;z-index:2}
.promo-cta{background:linear-gradient(135deg,#0E5C4A,#1F7A3B);color:#fff;border:0;padding:16px 22px;border-radius:14px;font-size:14px;font-weight:900;cursor:pointer;width:100%;margin-top:12px;box-shadow:0 8px 24px rgba(14,92,74,.5);position:relative;z-index:2;animation:promoCta 2s ease-in-out infinite;line-height:1.35}
@keyframes promoCta{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.promo-coin{position:absolute;font-size:24px;animation:floatCoin 4s ease-in-out infinite;pointer-events:none;z-index:1}
.promo-coin:nth-child(1){top:8%;left:8%;font-size:28px}
.promo-coin:nth-child(2){top:15%;right:10%;animation-delay:.5s;font-size:22px}
.promo-coin:nth-child(3){bottom:20%;left:12%;animation-delay:1s;font-size:20px}
.promo-coin:nth-child(4){bottom:10%;right:14%;animation-delay:1.5s;font-size:26px}
@keyframes floatCoin{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-18px) rotate(15deg)}50%{transform:translateY(-6px) rotate(-10deg)}75%{transform:translateY(-20px) rotate(8deg)}}

/* Visual refinements: realistic photography, clearer registration cards, and health fields */
.profile-intro{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center;padding:14px;margin:0 0 18px;border:1px solid var(--line);border-radius:16px;background:var(--card2);overflow:hidden}
.profile-intro img{width:118px;height:108px;object-fit:cover;border-radius:12px;display:block;background:var(--line)}
.profile-intro h3{margin:0 0 5px;color:var(--ink);font-size:16px;line-height:1.35}
.profile-intro p{margin:0;color:var(--mut);font-size:12px;line-height:1.55}
.profile-intro .profile-kicker{display:inline-flex;align-items:center;gap:5px;color:var(--ac);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.health-panel{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}

const OTHER_VAL="__other__";

function cityOptions(country,selected){
  if(!country)return `<option value="">${t("Dooro dalka")}</option>`;
  const cities=AREAS_BY_COUNTRY[country]||[];
  const isOther = selected && selected!==OTHER_VAL && !cities.includes(selected);
  const out=[];
  out.push(`<option value="">${t("Dhammaan")} ${country}</option>`);
  cities.forEach(c=>out.push(`<option value="${esc(c)}"${selected===c?" selected":""}>${esc(c)}</option>`));
  out.push(`<option value="${OTHER_VAL}"${selected===OTHER_VAL||isOther?" selected":""}>➕ ${t("Magaalo kale")}...</option>`);
  return out.join("");
}

function cityOptionsForm(country,selected){
  const cities=country?(AREAS_BY_COUNTRY[country]||[]):[];
  if(!cities.length)return `<option value="">${t("Dooro dalka")}</option>`;
  const isOther = selected && selected!==OTHER_VAL && !cities.includes(selected);
  const out=cities.map(c=>`<option value="${esc(c)}"${selected===c?" selected":""}>${esc(c)}</option>`);
  out.push(`<option value="${OTHER_VAL}"${selected===OTHER_VAL||isOther?" selected":""}>➕ ${t("Magaalo kale")}...</option>`);
  return out.join("");
}

function toggleOtherCity(selId, inputId){

function getCityValue(selId,inputId){

  if(!sel)return "";
  if(sel.value===OTHER_VAL){return inp?(inp.value||"").trim():""}
  return sel.value;
}

const dialFor=id=>{const e=PHSEL[id]&&$("#"+PHSEL[id]);if(e&&DIAL[e.value])LASTC=e.value;return DIAL[(e&&e.value)||LASTC]||"252"};
function normPhone(v,d){let x=String(v||"").replace(/[^\d+]/g,"");if(!x||x==="+")return"";if(x.startsWith("00"))x="+"+x.slice(2);if(x[0]==="+"){const g=x.slice(1).replace(/\D/g,"");return"+"+g}let g=x.replace(/\D/g,"");if(g[0]==="0")g=g.slice(1);else if(g.startsWith(d)&&g.length>=d.length+8)return"+"+g;return"+"+d+g}
function setDial(pid){const p=$("#"+pid);if(!p)return;const d=dialFor(pid),cur=p.value.trim().replace(/\s/g,"");if(!cur||/^\+\d{1,4}$/.test(cur)||DIALS.some(k=>cur.startsWith("+"+k)&&cur.length<=k.length+1+2)){p.value="+"+d+" "}else if(cur.startsWith("+")){const old=DIALS.find(k=>cur.startsWith("+"+k));if(old&&old!==d)p.value="+"+d+cur.slice(old.length+1)}p.placeholder="+"+d+" …"}
document.addEventListener("change",e=>{const id=e.target.id;for(const p in PHSEL)if(PHSEL[p]===id)setDial(p)});
document.addEventListener("focusin",e=>{const t=e.target;if(t.tagName==="INPUT"&&t.type==="tel"&&!t.value.trim())setDial(t.id)});
document.addEventListener("focusout",e=>{const t=e.target;if(t.tagName==="INPUT"&&t.type==="tel"&&t.value.trim()){t.value=normPhone(t.value,dialFor(t.id))}});
/* ===== ACCOUNT DELETE ===== */
function delAcc(id){modal(`<h2>🗑 Tirtir akoonka</h2><p>Profile-kaaga, dalabyada iyo xogtaada gaarka ah server-ka waa laga tirtirayaa, lagamana celin karo.</p><div class="row"><button class="d" style="flex:1" onclick="delGo(${id})">Haa, tirtir / Yes, delete</button><button class="o" onclick="closeM()">Jooji</button></div>`)}
async function delGo(id){try{await api("delete",{c:"workers",id,token:tokGet()["workers:"+id]});S.workers=S.workers.filter(w=>w.id!==id);const o=tokGet();delete o["workers:"+id];localStorage.setItem("shaqo_tok",J_(o));_save();closeM();render();toast("✅ Akoonka waa la tirtiray")}catch(e){toast("Error")}}
/* ===== ADMIN MANAGE (edit / suspend / delete) ===== */
function mgmtHtml(){const stb=x=>({ok:"✅",sugaya:"⏳",suspended:"🚫"}[x]||x),bt=(a,c,id,l)=>`<button class="o" onclick="admAct('${a}','${c}',${id})">${l}</button>`;
return`<h2>🛠 Manage</h2><div class="row sp" style="margin-bottom:8px"><span class="s">${ONLINE?"Server (live)":"Demo (local only)"}</span>${ONLINE?`<button class="o" onclick="ADM=null;KEY='';render()">Logout</button>`:""}</div><h3>👥 ${t("Shaqaale")} (${S.workers.length})</h3>`+S.workers.map(w=>`<div class="card"><div class="row sp"><div style="min-width:0"><b>${esc(w.name)}</b> ${stb(w.status)}<div class="s">${esc(w.skill)} · L${w.level||1}</div></div><div class="row">${bt("edit","workers",w.id,"✏️")}${bt(w.status==="suspended"?"unsuspend":"suspend","workers",w.id,w.status==="suspended"?"♻️":"🚫")}${bt("delete","workers",w.id,"🗑")}</div></div></div>`).join("")+`<h3>💼 ${t("Shaqooyin")} (${S.jobs.length})</h3>`+S.jobs.map(j=>`<div class="card"><div class="row sp"><div style="min-width:0"><b>${esc(j.title)}</b><div class="s">${esc(j.org)} · ${esc(j.area)}</div></div><div class="row">${bt("edit","jobs",j.id,"✏️")}${bt("delete","jobs",j.id,"🗑")}</div></div></div>`).join("")}
const admList=c=>(ONLINE&&ADM?ADM:S)[c]||[];
function admAct(a,c,id){if(a==="edit")return admEdit(c,id);if(a==="delete")return modal(`<h2>🗑 Delete?</h2><p>${esc((admList(c).find(x=>x.id===id)||{}).name||(admList(c).find(x=>x.id===id)||{}).title||"")}</p><div class="row"><button class="d" style="flex:1" onclick="admRun('delete','${c}',${id})">Yes, delete</button><button class="o" onclick="closeM()">Cancel</button></div>`);admRun(a,c,id)}
async function admDo(body,local){if(ONLINE&&ADM){try{ADM=await api("admin",{key:KEY,...body})}catch(e){toast("Error");return}}else{local();save()}closeM();render()}
function admRun(a,c,id){if(a==="delete")return admDo({action:"delete",c,id},()=>{S[c]=S[c].filter(x=>x.id!==id)});const st=a==="suspend"?"suspended":"ok";admDo({action:"edit",c,id,fields:{status:st}},()=>{S[c].find(x=>x.id===id).status=st})}
function admEdit(c,id){const x=admList(c).find(k=>k.id===id);if(!x)return;const i=(k,l,type)=>`<label for="ae_${k}">${l}</label><input id="ae_${k}" ${type||""} value="${esc(x[k])}">`,sl=(k,l,o)=>`<label for="ae_${k}">${l}</label><select id="ae_${k}">${o.map(v=>`<option${String(x[k])===String(v)?" selected":""}>${v}</option>`).join("")}</select>`;
modal(`<h2>✏️ Edit</h2>${c==="workers"?i("name","Name")+i("skill","Skill")+sl("level","Level",[1,2,3])+sl("status","Status",["ok","sugaya","suspended"]):i("title","Title")+i("org","Org")+i("area","Area")+i("n","Count",'type="number"')+i("sched","Schedule")+i("d","Details")}<div class="row" style="margin-top:12px"><button class="p" style="flex:1" onclick="admSave('${c}',${id})">Save</button><button class="o" onclick="closeM()">Cancel</button></div>`)}
function admSave(c,id){const keys=c==="workers"?["name","skill","level","status"]:["title","org","area","n","sched","d"],f={};keys.forEach(k=>{const v=$("#ae_"+k).value;f[k]=(k==="level"||k==="n")?+v:v});admDo({action:"edit",c,id,fields:f},()=>{Object.assign(S[c].find(x=>x.id===id),f)})}
/* ===== BACKEND LAYER (shared data when server.py is running; otherwise local demo mode) ===== */
const J_=x=>JSON.stringify(x);
let ONLINE=false,ADM=null,KEY="",snap={},syncT=null,INBOX={bookings:[],apps:[]};const OTPP={};
const tokGet=()=>{try{return JSON.parse(localStorage.getItem("shaqo_tok")||"{}")}catch(e){return{}}},tokSet=(c,i,t)=>{try{const o=tokGet();o[c+":"+i]=t;localStorage.setItem("shaqo_tok",J_(o))}catch(e){}},tokList=()=>Object.entries(tokGet()).map(([k,t])=>{const[c,i]=k.split(":");return{c,id:+i,token:t}});
const SYNC=["workers","jobs","donors","bookings","apps","sos","reqs"];
const api=async(p,b)=>{const r=await fetch("/api/"+p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:J_(b)}:{});if(!r.ok)throw new Error(r.status);return r.json()};
function fixNid(){try{Object.defineProperty(S,"nid",{configurable:true,enumerable:false,get(){return Date.now()*1000+Math.floor(Math.random()*1000)},set(){}})}catch(e){}}
const _save=save,_render=render,_vAdmin=vAdmin,_appr=appr;
save=function(){_save();fixNid();clearTimeout(syncT);syncT=setTimeout(flush,400)};
render=function(){fixNid();return _render()};
async function flush(){if(!ONLINE)return;let ch=0;for(const c of SYNC){for(const it of(S[c]||[])){if(it.id==null){it.id=S.nid++;ch=1}if(c==="workers"&&it.priv&&OTPP[it.phone])it.otpProof=OTPP[it.phone];let j=J_(it);if(snap[c]&&snap[c][it.id]===j)continue;try{const r=await api("push",{coll:c,item:it});delete it.otpProof;if(r.token)tokSet(c,it.id,r.token);if(r.phone){it.phone=r.phone;ch=1}j=J_(it);(snap[c]=snap[c]||{})[it.id]=j}catch(e){if(String(e.message)==="400"){delete it.otpProof;(snap[c]=snap[c]||{})[it.id]=J_(it)}}}}if(ch)_save();loadInbox()}
async function pull(){let d;try{S.donors.forEach(x=>{if(x.id==null)x.id=S.nid++});d=await api("state?mine="+S.workers.filter(w=>w.status==="sugaya").map(w=>w.id).join(",")+"&bk="+S.bookings.filter(b=>b.status!=="la qiimeeyay").map(b=>b.id).join(","))}catch(e){ONLINE=false;return}
{const was=ONLINE;ONLINE=true;if(!was&&view==="admin")render()}if(d.empty){snap={};await flush();return}
const before=J_([S.workers,S.jobs,S.donors]),loc=new Map(S.workers.map(w=>[w.id,w])),ids=new Set(d.workers.map(w=>w.id)),ws=d.workers.map(w=>{const l=loc.get(w.id);if(l&&l.priv)w.priv=l.priv;return w});
S.workers.forEach(w=>{if(ids.has(w.id))return;const m=d.mineStatus[w.id];if(m){if(m.status==="sugaya")ws.push(w);else if(m.status==="ok"){w.status="ok";w.level=m.level;ws.push(w)}}else if(!(snap.workers&&snap.workers[w.id]!==undefined))ws.push(w)});
const mg=(c,srv)=>{const L=new Map((S[c]||[]).map(x=>[x.id,x])),sid=new Set(srv.map(x=>x.id));srv.forEach(x=>{const l=L.get(x.id);if(l&&l.mine)x.mine=1});(S[c]||[]).forEach(x=>{if(x.id!=null&&!sid.has(x.id)&&!(snap[c]&&snap[c][x.id]!==undefined))srv.push(x)});return srv};
S.bookings.forEach(b=>{const s2=d.bookingStatus&&d.bookingStatus[b.id];if(s2&&b.status==="sugaya"&&(s2==="aqbalay"||s2==="diiday"))b.status=s2});const sj=mg("jobs",d.jobs),sd=mg("donors",d.donors);S.workers=ws;S.jobs=sj;S.donors=sd;
[["workers",d.workers],["jobs",d.jobs],["donors",d.donors]].forEach(([c,a])=>{snap[c]=snap[c]||{};const k=new Set(a.map(x=>x.id));S[c].forEach(x=>{if(k.has(x.id))snap[c][x.id]=J_(x)})});
_save();if(J_([S.workers,S.jobs,S.donors])!==before&&["welcome","raadi","jobs","dhiig"].includes(view)&&$("#modal").hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();flush()}
async function sendOtp(){const p=normPhone($("#wp").value,dialFor("wp"));$("#wp").value=p;if(!p){toast("Telefoon geli");return}if(!ONLINE){toast("OTP demo: 1234");return}try{const r=await api("otp/send",{phone:p});toast(r.code?"OTP (dev): "+r.code:"OTP waa la diray / sent")}catch(e){toast("OTP error ("+e.message+")")}}
async function otpCheck(p,c){if(!ONLINE)return c==="1234";try{const r=await api("otp/verify",{phone:p,code:c});OTPP[p]=r.proof;return true}catch(e){return false}}
async function loadInbox(){const tk=tokList();if(!ONLINE||!tk.length)return;try{const r=await api("inbox",{tokens:tk}),n=r.bookings.filter(b=>b.status==="sugaya").length+r.apps.length,o=INBOX.bookings.filter(b=>b.status==="sugaya").length+INBOX.apps.length;INBOX=r;if(n>o)toast("📥 Dalab cusub / New request");if(view==="dalab"&&$("#modal").hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}catch(e){}}
async function inAct(id,st,wid){const t=tokGet()["workers:"+wid];try{await api("act",{id,token:t,status:st});await loadInbox();render()}catch(e){toast("Error")}}
function inboxHtml(){if(!INBOX.bookings.length&&!INBOX.apps.length)return"";const B=INBOX.bookings.map(b=>{const w=S.workers.find(k=>k.id===b.wid)||{};return`<div class="card"><div class="row sp"><b>📥 ${esc(b.rn||"?")}</b><span class="tag g">${esc(b.status)}</span></div><div class="s">${esc(w.skill||"")} · ${esc(b.d)} ${to12h(b.t)} · ${esc(b.h)}</div><div class="s">${esc(b.a)}</div><div class="s">📞 <a href="tel:${esc(b.rp)}">${esc(b.rp)}</a></div>${b.status==="sugaya"?`<div class="row" style="margin-top:12px"><button class="p" onclick="inAct(${b.id},'aqbalay',${b.wid})">✓ Aqbal</button><button class="o" onclick="inAct(${b.id},'diiday',${b.wid})">✕ Diid</button></div>`:""}</div>`}).join(""),A=INBOX.apps.map(a=>{const j=S.jobs.find(k=>k.id===a.jid)||{};return`<div class="card"><b>👤 ${esc(a.name)}</b> <span class="s">→ ${esc(j.title||"")}</span><div class="s">📞 <a href="tel:${esc(a.phone)}">${esc(a.phone)}</a></div>${a.note?`<div class="s">${esc(a.note)}</div>`:""}</div>`}).join("");return`<h2 style="margin:8px 0 12px">📥 Inbox</h2>${B}${A}<h2 style="margin:20px 0 12px">📤 ${t("Dalabyo")}</h2>`}
const _vDalab=vDalab;vDalab=function(){let sv;if(ONLINE){sv=NEXT.sugaya;NEXT.sugaya=undefined}let h;try{h=_vDalab()}finally{if(ONLINE)NEXT.sugaya=sv}const ws=Object.keys(tokGet()).filter(k=>k.startsWith("workers:")).map(k=>+k.split(":")[1]).filter(i=>S.workers.some(w=>w.id===i)),dl=ws.map(i=>`<div class="card"><div class="s">${esc((S.workers.find(w=>w.id===i)||{}).name||"")}</div><button class="o" onclick="delAcc(${i})">🗑 Tirtir akoonka / Delete account</button></div>`).join("");return inboxHtml()+h+dl};
vAdmin=function(){if(!ONLINE)return _vAdmin()+mgmtHtml();if(!ADM)return`<div class="page-header"><h1 class="page-title">⚙️ Admin</h1></div><div class="card"><label for="ak">Admin key</label><input id="ak" type="password" autocomplete="off"><button class="p" style="width:100%;margin-top:12px" onclick="admLogin()">Gal / Login</button></div>`;
const b={};SYNC.forEach(c=>{b[c]=S[c];S[c]=ADM[c]||[]});try{return _vAdmin()+mgmtHtml()}finally{SYNC.forEach(c=>S[c]=b[c])}};
async function admLogin(){KEY=$("#ak").value;try{ADM=await api("admin",{key:KEY,action:"list"});render()}catch(e){ADM=null;toast("Admin key khalad / wrong key")}}
appr=async function(id,ok){if(!ONLINE||!ADM)return _appr(id,ok);try{ADM=await api("admin",{key:KEY,action:ok?"approve":"reject",id})}catch(e){toast("Error");return}render()};
updateBrand();updatePromoText();render();
fixNid();if(/admin/i.test(location.hash+location.search))go("admin");addEventListener("hashchange",()=>{if(/admin/i.test(location.hash))go("admin")});pull();setInterval(()=>{if(!document.hidden){pull();flush()}},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
</script></body></html>
